name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" on `main` runs the whole pipeline and deploys without a new commit (`pnpm deploy:setup` uses it).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned: `@latest` would let a CLI release change how production deploys between two identical pushes. Keep it equal
  # to `VERCEL_CLI` in src/scripts/deploy/vercel.ts.
  VERCEL_CLI_VERSION: 65.11.0

jobs:
  lint:
    name: Lint, Type Check & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Fails on a critical advisory in a shipped dependency. Reviewed, unreachable advisories are listed under
      # `auditConfig.ignoreGhsas` in pnpm-workspace.yaml.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.14

      - name: Run Biome
        run: biome ci . --diagnostic-level=warn

      - name: Type check
        run: pnpm exec tsc --noEmit

  # The tests need no secret, so they also run on pull requests from forks. `.env.test` holds the database settings
  # and the runners set the URLs; the values below only satisfy the env schema. No test sends an email, so the fake
  # Resend key is never used.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    env: &test-env
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-only-test-secret-never-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_FROM_EMAIL: Test <test@example.com>
      RESEND_API_KEY: re_ci_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    env: *test-env
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run integration tests
        run: pnpm test:integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    env: *test-env
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Cypress binary
        id: cypress-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Cypress binary
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        run: pnpm exec cypress install

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tests/cypress/logs/
            tests/cypress/screenshots/
            tests/cypress/videos/
          retention-days: 7

  # Vercel builds the app with the project's own environment variables (Sensitive ones included, which `vercel pull`
  # cannot read), then applies the pending migrations (src/scripts/vercel-build.ts). GitHub holds the Vercel token, plus
  # an optional PostHog key for the deploy marker.
  deploy:
    name: Deploy to Vercel
    needs: [unit-tests, integration-tests, e2e-tests]
    if: vars.DEPLOYMENT_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ci-cd
      url: ${{ steps.deploy.outputs.url }}
    # One production change at a time, and never cancelled halfway: a newer push waits for this one to finish.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      # Variables since `pnpm deploy:setup`; projects set up before it keep them as secrets.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
      # The PostHog app (not ingestion) host and the numeric project id, for the deploy annotation.
      POSTHOG_APP_HOST: ${{ vars.POSTHOG_APP_HOST || 'https://us.posthog.com' }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Names every missing setting (token, ids, a Vercel variable the env schema requires) before anything builds. The
      # token is set only on the steps that use it, so no install script ever sees it.
      - name: Check the deploy settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm deploy:check

      - name: Install Vercel CLI
        run: npm install --global --ignore-scripts "vercel@$VERCEL_CLI_VERSION"

      # Waits for the build: a failed build or migration fails this step and prints the link to its log. stdout is the
      # deployment URL alone. The release version ties the uploaded source maps to the commit CI tested.
      - name: Build and deploy on Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prod --yes --build-env POSTHOG_RELEASE_VERSION="$GITHUB_SHA")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${GITHUB_SHA:0:9} to $url" >> "$GITHUB_STEP_SUMMARY"

      # Marks the deploy on every PostHog chart (short sha + commit subject), so a jump in a line can be read against
      # what shipped. The key needs `annotation:write`; projects set up before the source-map key moved to Vercel can
      # still reuse it. A failed, slow or skipped marker never fails the deploy.
      - name: Mark the deploy on PostHog charts
        continue-on-error: true
        timeout-minutes: 2
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_ANNOTATIONS_API_KEY || secrets.POSTHOG_SOURCEMAPS_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$POSTHOG_API_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then echo "No PostHog key or project id; skipping."; exit 0; fi

          subject="${COMMIT_MESSAGE%%$'\n'*}"
          subject="${subject:-manual run by $GITHUB_ACTOR}"
          content="$(printf 'Deploy %s: %s' "${GITHUB_SHA:0:9}" "$subject" | cut -c1-400)"
          curl -fsS --connect-timeout 10 --max-time 20 -X POST "$POSTHOG_APP_HOST/api/projects/$POSTHOG_PROJECT_ID/annotations/" \
            -H "Authorization: Bearer $POSTHOG_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$content" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  '{content:$content, date_marker:$at, scope:"project"}')" > /dev/null
          echo "Marked: $content"
